app = "edu-orb"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 250
    soft_limit = 200

  [[http_service.ports]]
    handlers = ["http"]
    port = 80

  [[http_service.ports]]
    handlers = ["tls", "http"]
    port = 443

# Environment variables — API keys for the tutor features.
# These are set via `fly secrets set` (not in this file) to keep them secure.
# See README for the keys to configure.

[checks]
  [checks.healthcheck]
    grace_period = "30s"
    interval = "30s"
    method = "get"
    path = "/"
    timeout = "10s"
    type = "http"
